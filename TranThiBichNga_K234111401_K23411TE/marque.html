<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquee Cam Kết</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #e0f2f1;
      font-family: Arial, sans-serif;
    }

    .marquee-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Nội dung cuộn dọc */
    .marquee-content {
      position: absolute;
      width: 100%;
      animation: scroll-up 3s linear infinite; /* chạy chậm hơn để full khung */
    }

    .marquee-content p {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
      margin: 0;
      color: #333;
      animation: blinkColors 5s infinite alternate ease-in-out;
    }

    /* Animation cuộn dọc toàn khung */
    @keyframes scroll-up {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }

    /* Đổi màu neon */
    @keyframes blinkColors {
      0%   { color: #ffeb3b; text-shadow: 0 0 10px #ffeb3b; }
      25%  { color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
      50%  { color: #ff4081; text-shadow: 0 0 15px #ff4081; }
      75%  { color: #76ff03; text-shadow: 0 0 15px #76ff03; }
      100% { color: #fff;     text-shadow: 0 0 20px #fff; }
    }
  </style>
</head>
<body>
  <div class="marquee-container">
    <div class="marquee-content">
      <p>I declare that all of these solutions are my own and not copied from anyone in this class.</p>
    </div>
  </div>
</body>
</html>
