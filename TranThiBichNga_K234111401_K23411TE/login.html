<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }

    body {
        background: linear-gradient(135deg, #78f0ca, #92eba0);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        background: white;
        width: 360px;
        border-radius: 16px;
        padding: 40px 30px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        text-align: center;
        position: relative;
    }

    .login-container .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin: 0 auto 20px;
        object-fit: cover;
        border: 4px solid #afe198;
    }

    .login-container h2 {
        margin-bottom: 30px;
        color: #333;
        font-weight: 700;
    }

    .input-group {
        position: relative;
        margin-bottom: 20px;
    }

    .input-group i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #78f0ca;
    }

    .input-group input {
        width: 100%;
        padding: 12px 12px 12px 40px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
        transition: 0.3s;
    }

    .input-group input:focus {
        outline: none;
        border-color: #84f8dd;
        box-shadow: 0 0 8px rgba(173, 244, 213, 0.4);
    }

    .login-container button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        color: white;
        background: linear-gradient(135deg, #78f0ca, #92eba0);
        cursor: pointer;
        transition: 0.3s;
    }

    .login-container button:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    .login-container .forgot {
        display: block;
        margin-top: 12px;
        font-size: 14px;
        color:  #73af57;
        text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 400px){
        .login-container {
            width: 90%;
            padding: 30px 20px;
        }
    }
</style>
</head>
<body>

<div class="login-container">
    <img src="images/ava.jpg" alt="Avatar" class="avatar">
    <h2>Welcome</h2>

    <form id="loginForm">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
        </div>
        <button type="submit"><i class="fas fa-sign-in-alt"></i> Login</button>
        <a href="#" class="forgot">Forgot password?</a>
    </form>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(e){
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value.trim();

        if(user && pass){
            localStorage.setItem("loggedInUser", user);
            alert("🎉 Login thành công!");
            // gửi message lên main.html để update trạng thái
            window.parent.postMessage({ type: "loginSuccess" }, "*");
        } else {
            alert(" Vui lòng nhập đầy đủ thông tin!");
        }
    });
</script>

</body>
</html>
